<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
      (function() {
        const theme = localStorage.getItem('vite-ui-theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#030712';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#ffffff';
        }
      })();
    </script>
    <style>
      html.dark, html.dark body { background-color: #030712 !important; }
      html, body { background-color: #ffffff; }
    </style>
    <link rel="icon" type="image/png" href="/RDX.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/RDX.png" />
    <title>Dexter Auth | Best Free Authentication API for C++, C#, and ImGui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
