<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 0 658 658" width="100%" height="100%">
  <defs>
    <!-- Background Frame Gradient matching your design -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C79FE" />
      <stop offset="100%" stop-color="#3363ED" />
    </linearGradient>

    <!-- Soft Drop Shadow for the Logo and Text Elements -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#142A87" flood-opacity="0.25" />
    </filter>

    <!-- Mask to cleanly cut a perfectly parallel gap around the checkmark from the 'A' shape -->
    <mask id="checkmarkCutout">
      <rect width="100%" height="100%" fill="white" />
      <path d="M 250 247 L 302 308 L 408 204" fill="none" stroke="black" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;display=swap');
    .authlx-text {
      font-family: 'Montserrat', 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Frame: Matches the exact bounding box (Left: 15, Top: 12, Width: 615, Height: 634) and corner radius (148px) from logo.png -->
  <rect x="15" y="12" width="615" height="634" fill="url(#bgGradient)" rx="148" ry="148" />

  <!-- Unified Group with Global Shadow -->
  <g filter="url(#softShadow)">
    
    <!-- Shield Outline: Mathematically fitted Cubic Bezier curves with exact border thickness from logo.png -->
    <path d="M 322 72 C 345 95, 465 125, 474 146 L 474 272 C 474 370, 404 410, 322 431 C 240 410, 170 370, 170 272 L 170 146 C 179 125, 299 95, 322 72 Z M 322 101 C 345 122, 437 149, 446 174 L 446 272 C 446 342, 390 390, 322 402 C 254 390, 198 342, 198 272 L 198 174 C 207 149, 299 122, 322 101 Z" fill="#ffffff" fill-rule="evenodd" />

    <!-- 'A' Shape (Lambda) under checkmark cutout mask -->
    <path d="M 322 149 L 230 316 L 275 316 L 322 230 L 369 316 L 420 316 Z" fill="#ffffff" mask="url(#checkmarkCutout)" />

    <!-- Solid Checkmark -->
    <path d="M 250 247 L 302 308 L 408 204" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Smooth Crisp Vector Text -->
    <text x="322" y="525" class="authlx-text" font-size="76" fill="#ffffff" text-anchor="middle">AuthLX</text>

  </g>
</svg>
